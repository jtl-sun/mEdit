name: Build mEdit for Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ubuntu-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot libarchive-tools libx11-dev libxkbfile-dev

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.33.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Electron native dependencies
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm

      - name: Verify source
        id: source-meta
        run: |
          APP_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          PRODUCT_NAME=$(node -p "require('./packages/desktop/package.json').productName")
          test "$PRODUCT_NAME" = "mEdit"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify TypeScript
        run: pnpm --filter marktext typecheck

      - name: Build Ubuntu AppImage and DEB
        run: pnpm build:linux:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Ubuntu packages and installed commands
        run: |
          set -euo pipefail
          VERSION='${{ steps.source-meta.outputs.app_version }}'
          APPIMAGE="dist/mEdit-Ubuntu-x64-$VERSION.AppImage"
          DEB="dist/mEdit-Ubuntu-x64-$VERSION.deb"
          test -f "$APPIMAGE"
          test -f "$DEB"
          chmod +x "$APPIMAGE"
          dpkg-deb --info "$DEB" >/dev/null

          # Install the exact package we just built. This catches post-install
          # alias bugs that a metadata-only check cannot detect.
          sudo apt-get install -y "$PWD/$DEB"
          command -v marktext
          command -v mEdit
          command -v medit
          test -x "$(command -v marktext)"
          test -x "$(command -v mEdit)"
          test -x "$(command -v medit)"
          test "$(readlink -f "$(command -v mEdit)")" = "$(readlink -f "$(command -v marktext)")"
          test "$(readlink -f "$(command -v medit)")" = "$(readlink -f "$(command -v marktext)")"

          sha256sum "$APPIMAGE" "$DEB" > dist/SHA256SUMS-Ubuntu.txt

      - name: Upload Ubuntu files
        uses: actions/upload-artifact@v4
        with:
          name: mEdit-${{ steps.source-meta.outputs.app_version }}-Ubuntu-x64
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-Ubuntu.txt
